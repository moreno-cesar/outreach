<title>Outreach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Inter:ital,wght@0,400&display=swap">
<style>
  :root{
    --bg:#F5F4F1;
    --surface:#FFFFFF;
    --surface-2:#FAFAF8;
    --surface-hover:#F0EFEB;
    --border:#E4E2DC;
    --border-soft:#ECEAE4;
    --text:#1D1D1F;
    --text-secondary:#6E6E73;
    --text-tertiary:#9C9C9F;
    --accent:#4F6D7A;
    --accent-strong:#3C5561;
    --accent-soft:#E5EDEE;
    --accent-soft-text:#3C5561;
    --warn:#B0763A;
    --warn-soft:#F5EAD9;
    --danger:#B14A3E;
    --danger-soft:#F6E5E2;
    --sage:#5E7F5A;
    --sage-soft:#E7EEE4;
    --plum:#7E6288;
    --plum-soft:#EFE7F1;
    --shadow-sm:0 1px 2px rgba(20,20,20,0.06);
    --shadow-md:0 8px 24px rgba(20,20,20,0.10);
    --radius:10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1A1C;
      --surface:#222224;
      --surface-2:#28282B;
      --surface-hover:#2F2F32;
      --border:#38383B;
      --border-soft:#313134;
      --text:#F1F1F1;
      --text-secondary:#A5A5A9;
      --text-tertiary:#77777B;
      --accent:#89ABB8;
      --accent-strong:#A6C4CE;
      --accent-soft:#25333A;
      --accent-soft-text:#A6C4CE;
      --warn:#D9A567;
      --warn-soft:#3B2E1B;
      --danger:#DA8377;
      --danger-soft:#3B2420;
      --sage:#8FB389;
      --sage-soft:#25311F;
      --plum:#B79BC0;
      --plum-soft:#312539;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 8px 28px rgba(0,0,0,0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1A1C;
    --surface:#222224;
    --surface-2:#28282B;
    --surface-hover:#2F2F32;
    --border:#38383B;
    --border-soft:#313134;
    --text:#F1F1F1;
    --text-secondary:#A5A5A9;
    --text-tertiary:#77777B;
    --accent:#89ABB8;
    --accent-strong:#A6C4CE;
    --accent-soft:#25333A;
    --accent-soft-text:#A6C4CE;
    --warn:#D9A567;
    --warn-soft:#3B2E1B;
    --danger:#DA8377;
    --danger-soft:#3B2420;
    --sage:#8FB389;
    --sage-soft:#25311F;
    --plum:#B79BC0;
    --plum-soft:#312539;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 28px rgba(0,0,0,0.45);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
  input, textarea, select{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    outline:none;
    width:100%;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  button{ cursor:pointer; border:none; background:none; }
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  ::selection{ background:var(--accent-soft); }
  .tnum{ font-variant-numeric: tabular-nums; }

  .app{
    height:100%;
    display:flex;
    flex-direction:column;
  }
  .content{
    flex:1;
    min-height:0;
    display:flex;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    flex:0 0 232px;
    background:var(--surface-2);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .brand{
    padding:20px 18px 14px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand-mark{
    width:26px; height:26px; border-radius:7px;
    background:linear-gradient(155deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:13px;
    flex:0 0 auto;
  }
  .brand-name{ font-weight:600; font-size:15.5px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:11.5px; color:var(--text-tertiary); padding:0 18px 14px; margin-top:-8px; }

  .cat-list{
    list-style:none; margin:0; padding:6px 10px 16px;
    overflow-y:auto;
  }
  .cat-item{
    display:flex; align-items:center; gap:9px;
    padding:8px 10px; margin-bottom:2px;
    border-radius:8px; cursor:pointer;
    color:var(--text-secondary);
    font-weight:500;
    position:relative;
  }
  .cat-item:hover{ background:var(--surface-hover); color:var(--text); }
  .cat-item.active{ background:var(--accent-soft); color:var(--accent-soft-text); }
  .cat-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; background:var(--text-tertiary); }
  .cat-item.active .cat-dot{ background:var(--accent-strong); }
  .cat-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
  .cat-count{ font-size:11.5px; color:var(--text-tertiary); font-weight:600; }
  .cat-item.active .cat-count{ color:var(--accent-soft-text); }
  .cat-heading{ padding:14px 20px 6px; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-tertiary); }

  .sidebar-foot{
    margin-top:auto;
    padding:12px 16px 16px;
    border-top:1px solid var(--border-soft);
  }
  .storage-note{
    font-size:11.5px; color:var(--text-tertiary); line-height:1.5;
    display:flex; gap:7px; align-items:flex-start;
  }
  .storage-note svg{ flex:0 0 auto; margin-top:1px; }

  /* ---------- Panes row ---------- */
  .panes{ flex:1; min-height:0; display:flex; }

  /* ---------- List pane ---------- */
  .list-pane{
    flex:0 0 336px;
    border-right:1px solid var(--border);
    background:var(--bg);
    display:flex; flex-direction:column; min-height:0;
  }
  .list-toolbar{
    padding:16px 16px 10px;
    display:flex; flex-direction:column; gap:10px;
    border-bottom:1px solid var(--border-soft);
  }
  .list-toolbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .pane-title{ font-size:18px; font-weight:650; letter-spacing:-0.015em; }
  .pane-count{ font-size:12px; color:var(--text-tertiary); font-weight:500; margin-top:1px; }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 12px; border-radius:8px;
    font-weight:550; font-size:13px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text);
    box-shadow:var(--shadow-sm);
    white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-hover); }
  .btn-primary{
    background:var(--accent); color:#fff; border-color:transparent;
  }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; box-shadow:none; color:var(--text-secondary); }
  .btn-ghost:hover{ background:var(--surface-hover); color:var(--text); }
  .btn-danger{ color:var(--danger); }
  .btn-icon{ padding:7px; }
  .btn-sm{ padding:5px 9px; font-size:12px; }

  .search-wrap{ position:relative; }
  .search-wrap input{ padding-left:32px; }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); }

  .sort-row{ display:flex; align-items:center; gap:6px; }
  .sort-label{ font-size:11.5px; color:var(--text-tertiary); }
  .seg{ display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:2px; gap:2px; }
  .seg button{ padding:4px 9px; border-radius:5px; font-size:12px; font-weight:550; color:var(--text-secondary); }
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }

  .contact-list{ flex:1; overflow-y:auto; padding:6px 8px 14px; }
  .contact-card{
    display:flex; align-items:center; gap:11px;
    padding:10px; border-radius:10px; cursor:pointer;
    margin-bottom:2px;
    border:1px solid transparent;
  }
  .contact-card:hover{ background:var(--surface-hover); }
  .contact-card.selected{ background:var(--accent-soft); border-color:transparent; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:650; font-size:13px; color:#fff;
    flex:0 0 auto;
  }
  .card-main{ min-width:0; flex:1; }
  .card-top{ display:flex; align-items:baseline; gap:6px; }
  .card-name{ font-weight:600; font-size:13.8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stale-dot{ width:6px; height:6px; border-radius:50%; background:var(--warn); flex:0 0 auto; }
  .card-sub{ font-size:12.2px; color:var(--text-tertiary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
  .card-right{ text-align:right; flex:0 0 auto; }
  .card-last{ font-size:11.5px; color:var(--text-tertiary); }
  .card-last.stale{ color:var(--warn); font-weight:600; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:40px 24px; color:var(--text-tertiary);
    height:100%;
  }
  .empty-state svg{ opacity:0.55; }
  .empty-state-title{ font-weight:600; color:var(--text-secondary); font-size:14px; }
  .empty-state-sub{ font-size:12.5px; max-width:220px; line-height:1.5; }

  /* ---------- Profile pane ---------- */
  .profile-pane{ flex:1; min-height:0; overflow-y:auto; background:var(--surface); }
  .profile-inner{ max-width:640px; margin:0 auto; padding:28px 32px 60px; }
  .back-row{ display:none; padding:14px 16px 0; }
  .profile-header{ display:flex; align-items:flex-start; gap:16px; }
  .avatar-lg{
    width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:650; font-size:22px; color:#fff; flex:0 0 auto;
  }
  .profile-heading{ flex:1; min-width:0; }
  .profile-name{ font-size:21px; font-weight:650; letter-spacing:-0.015em; }
  .profile-meta-row{ display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600;
  }
  .profile-actions{ display:flex; gap:8px; flex:0 0 auto; }

  .stale-banner{
    margin-top:16px; padding:10px 13px; border-radius:9px;
    background:var(--warn-soft); color:var(--warn);
    font-size:12.8px; font-weight:550;
    display:flex; align-items:center; gap:8px;
  }

  .info-grid{
    margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;
    padding:16px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:12px;
  }
  .info-field{ min-width:0; }
  .info-field.span2{ grid-column:1 / -1; }
  .info-label{ font-size:11px; color:var(--text-tertiary); font-weight:600; letter-spacing:0.03em; text-transform:uppercase; margin-bottom:4px; }
  .info-value{ font-size:13.8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info-value.muted{ color:var(--text-tertiary); }
  .info-value a{ color:var(--text); text-decoration:none; }
  .info-value a:hover{ color:var(--accent); text-decoration:underline; }

  .section{ margin-top:26px; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .section-title{ font-size:12.5px; font-weight:650; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-tertiary); }
  .save-hint{ font-size:11.5px; color:var(--text-tertiary); }
  .save-hint.saved{ color:var(--sage); }

  .notes-box{
    width:100%; min-height:140px; resize:vertical;
    border-radius:10px; padding:12px 14px; line-height:1.55; font-size:13.6px;
    background:var(--surface-2); border:1px solid var(--border-soft);
  }

  .contacted-row{ display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }

  .edit-form{ margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .edit-form .full{ grid-column:1/-1; }
  .field label{ display:block; font-size:11.5px; color:var(--text-tertiary); font-weight:600; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em; }
  .form-actions{ display:flex; gap:8px; margin-top:4px; grid-column:1/-1; }

  .delete-zone{ margin-top:34px; padding-top:18px; border-top:1px solid var(--border-soft); display:flex; justify-content:flex-end; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,0.42);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--surface); border-radius:16px; box-shadow:var(--shadow-md);
    width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    padding:24px;
  }
  .modal h2{ margin:0 0 4px; font-size:18px; font-weight:650; letter-spacing:-0.01em; }
  .modal-sub{ font-size:12.5px; color:var(--text-tertiary); margin-bottom:18px; }
  .modal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-grid .full{ grid-column:1/-1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px;
    font-size:12.8px; font-weight:550; box-shadow:var(--shadow-md);
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  [hidden]{ display:none !important; }

  /* ---------- Mobile category bar ---------- */
  .cat-bar{ display:none; }

  @media (max-width: 999px){
    .content{ flex-direction:column; }
    .sidebar{ flex:0 0 auto; flex-direction:row; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar > .brand, .sidebar > .cat-heading, .sidebar > .sidebar-foot{ display:none; }
    .sidebar > .cat-list{ display:none; }
    .cat-bar{
      display:flex; gap:8px; overflow-x:auto; padding:12px 14px;
      width:100%;
    }
    .cat-chip{
      flex:0 0 auto; display:flex; align-items:center; gap:6px;
      padding:7px 13px; border-radius:999px; font-size:12.5px; font-weight:600;
      background:var(--surface); border:1px solid var(--border); color:var(--text-secondary);
      white-space:nowrap;
    }
    .cat-chip.active{ background:var(--accent); color:#fff; border-color:transparent; }
    .cat-chip .cat-chip-count{ opacity:0.75; font-weight:600; }
    .panes{ flex-direction:row; }
    .list-pane{ flex:0 0 45%; }
  }

  @media (max-width: 680px){
    .panes.show-list .profile-pane{ display:none; }
    .panes.show-profile .list-pane{ display:none; }
    .list-pane{ flex:1 1 auto; }
    .back-row{ display:block; }
    .profile-inner{ padding:8px 20px 60px; }
    .info-grid{ grid-template-columns:1fr; }
    .edit-form{ grid-template-columns:1fr; }
    .modal-grid{ grid-template-columns:1fr; }
  }
</style>

<div class="app" id="app">
  <div class="content">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">O</div>
        <div class="brand-name">Outreach</div>
      </div>
      <div class="brand-sub">Key relationships, in one place</div>
      <div class="cat-heading">Categories</div>
      <ul class="cat-list" id="catList"></ul>
      <div class="sidebar-foot">
        <div class="storage-note" id="storageNote">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span>Changes save automatically for your organization.</span>
        </div>
      </div>
    </aside>

    <div class="cat-bar" id="catBar"></div>

    <div class="panes show-list" id="panes">
      <section class="list-pane">
        <div class="list-toolbar">
          <div class="list-toolbar-row">
            <div>
              <div class="pane-title" id="listTitle">All Contacts</div>
              <div class="pane-count" id="listCount">0 people</div>
            </div>
            <button class="btn btn-primary btn-sm" id="addBtn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              Add
            </button>
          </div>
          <div class="search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="searchInput" type="text" placeholder="Search people or companies" autocomplete="off">
          </div>
          <div class="sort-row">
            <span class="sort-label">Sort</span>
            <div class="seg" id="sortSeg">
              <button data-sort="name" class="active">Name</button>
              <button data-sort="recent">Last contact</button>
            </div>
          </div>
        </div>
        <div class="contact-list" id="contactList"></div>
      </section>

      <section class="profile-pane" id="profilePane">
        <div class="back-row">
          <button class="btn btn-ghost btn-sm" id="backBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            All people
          </button>
        </div>
        <div id="profileContent"></div>
      </section>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <h2>Add a person</h2>
    <div class="modal-sub">Just enough to start tracking the relationship.</div>
    <form id="addForm">
      <div class="modal-grid">
        <div class="field full">
          <label>First name</label>
          <input name="firstName" required autocomplete="off">
        </div>
        <div class="field">
          <label>Last name</label>
          <input name="lastName" autocomplete="off">
        </div>
        <div class="field">
          <label>Category</label>
          <input name="category" list="categoryOptions" placeholder="Client" autocomplete="off">
          <datalist id="categoryOptions"></datalist>
        </div>
        <div class="field full">
          <label>Company</label>
          <input name="company" autocomplete="off">
        </div>
        <div class="field">
          <label>Email</label>
          <input name="email" type="email" autocomplete="off">
        </div>
        <div class="field">
          <label>Phone</label>
          <input name="phone" type="tel" autocomplete="off">
        </div>
        <div class="field full">
          <label>Last spoke</label>
          <input name="lastContacted" type="date">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn btn-primary">Add person</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

  var els = {

    listTitle: document.getElementById("listTitle"),
    listCount: document.getElementById("listCount"),
    profileContent: document.getElementById("profileContent"),
    panes: document.getElementById("panes"),
    searchInput: document.getElementById("searchInput"),
    sortSeg: document.getElementById("sortSeg"),
    addBtn: document.getElementById("addBtn"),
    addOverlay: document.getElementById("addOverlay"),
    addForm: document.getElementById("addForm"),
    cancelAdd: document.getElementById("cancelAdd"),
    categoryOptions: document.getElementById("categoryOptions"),
    backBtn: document.getElementById("backBtn"),
    toast: document.getElementById("toast"),
    storageNote: document.getElementById("storageNote")
  };

  // ---------- utilities ----------
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function initials(first, last){
    var a = (first || "").trim().charAt(0);
    var b = (last || "").trim().charAt(0);
    var s = (a + b).toUpperCase();
    return s || "?";
  }
  function fullName(c){ return ((c.firstName||"") + " " + (c.lastName||"")).trim() || "Unnamed"; }
  function todayLocalMidnight(){
    var d = new Date();
    d.setHours(0,0,0,0);
    return d;
  }
  function toISODate(d){
    var off = d.getTimezoneOffset();
    var local = new Date(d.getTime() - off*60000);
    return local.toISOString().slice(0,10);
  }
  function parseISODate(s){
    if(!s) return null;
    var parts = s.split("-");
    if(parts.length !== 3) return null;
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    return isNaN(d.getTime()) ? null : d;
  }
  function daysSince(dateStr){
    var d = parseISODate(dateStr);
    if(!d) return null;
    var diff = todayLocalMidnight().getTime() - d.getTime();
    return Math.round(diff / 86400000);
  }
  function relativeLabel(dateStr){
    var days = daysSince(dateStr);
    if(days === null) return "Never logged";
    if(days === 0) return "Today";
    if(days === 1) return "Yesterday";
    if(days < 0) return "In " + Math.abs(days) + "d";
    if(days < 14) return days + "d ago";
    if(days < 60) return Math.round(days/7) + "w ago";
    return Math.round(days/30) + "mo ago";
  }
  function formatDateLong(dateStr){
    var d = parseISODate(dateStr);
    if(!d) return "—";
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
  }
  function isStale(c){
    var days = daysSince(c.lastContacted);
    return days !== null && days >= STALE_DAYS;
  }
  function categoryColors(cat){
    if(CATEGORY_COLORS[cat]) return CATEGORY_COLORS[cat];
    var idx = 0;
    for(var i=0;i<cat.length;i++){ idx = (idx + cat.charCodeAt(i)) % FALLBACK_COLORS.length; }
    var c = FALLBACK_COLORS[idx];
    return [c,c];
  }
  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ els.toast.classList.remove("show"); }, 2000);
  }

  // ---------- store (db capability with in-memory fallback) ----------
  var store = {
    listeners: [],
    subscribe: function(fn){ this.listeners.push(fn); fn(state.contacts.slice()); },
    emit: function(){
      var arr = state.contacts.slice();
      this.listeners.forEach(function(fn){ fn(arr); });
    }
  };

  var db = null;
  var col = null;

  function useMemoryFallback(){
    state.dbWritable = true;
    state.dbReady = true;
    state.contacts = SEED_CONTACTS.map(function(c){ return Object.assign({}, c); });
    els.storageNote.querySelector("span").textContent = "This device isn't connected to shared storage — changes stay only in this open tab.";
    store.emit();
  }

  function memoryAdd(data){
    var id = "local-" + Date.now() + "-" + Math.floor(Math.random()*1000);
    var doc = Object.assign({ id: id, createdAt: new Date().toISOString() }, data);
    state.contacts.push(doc);
    store.emit();
    return id;
  }
  function memoryUpdate(id, data){
    var c = state.contacts.find(function(x){ return x.id === id; });
    if(c) Object.assign(c, data);
    store.emit();
  }
  function memoryDelete(id){
    state.contacts = state.contacts.filter(function(x){ return x.id !== id; });
    store.emit();
  }

  function initStore(){
    if(!window.claude || typeof window.claude.use !== "function"){
      useMemoryFallback();
      return;
    }
    window.claude.use("db").then(function(dbNs){
      if(!dbNs){ useMemoryFallback(); return; }
      db = dbNs;
      col = db.collection("contacts");
      seedIfNeeded();
      col.onSnapshot(function(snap){
        state.dbReady = true;
        state.dbWritable = true;
        state.contacts = snap.docs.map(function(d){
          var data = d.data() || {};
          return Object.assign({ id: d.id }, data);
        });
        store.emit();
      }, function(err){
        useMemoryFallback();
      });
    }).catch(function(){ useMemoryFallback(); });
  }

  function seedIfNeeded(){
    db.doc("meta/config").get().then(function(snap){
      if(snap.exists) return;
      db.doc("meta/config").set({ seededAt: new Date().toISOString() }).catch(function(){});
      SEED_CONTACTS.forEach(function(c){
        var body = Object.assign({}, c);
        delete body.id;
        body.createdAt = new Date().toISOString();
        col.doc(c.id).set(body).catch(function(){});
      });
    }).catch(function(){});
  }

  function addContact(data){
    if(col){
      var body = Object.assign({ createdAt: new Date().toISOString() }, data);
      return col.add(body).then(function(ref){ return ref.id; }).catch(function(){
        showToast("Couldn't save — added locally instead.");
        return memoryAdd(data);
      });
    }
    return Promise.resolve(memoryAdd(data));
  }
  function updateContact(id, data){
    if(col){
      return db.doc("contacts/" + id).update(data).catch(function(){
        showToast("Couldn't save that change.");
      });
    }
    memoryUpdate(id, data);
    return Promise.resolve();
  }
  function deleteContact(id){
    if(col){
      return db.doc("contacts/" + id).delete().catch(function(){
        showToast("Couldn't remove that person.");
      });
    }
    memoryDelete(id);
    return Promise.resolve();
  }

  // ---------- derived data ----------
  function orderedCategories(contacts){
    var seen = {};
    contacts.forEach(function(c){ if(c.category) seen[c.category] = true; });
    var known = CATEGORY_ORDER.filter(function(c){ return seen[c]; });
    var rest = Object.keys(seen).filter(function(c){ return CATEGORY_ORDER.indexOf(c) === -1; }).sort();
    return known.concat(rest);
  }
  function filteredContacts(){
    var q = state.search.trim().toLowerCase();
    var list = state.contacts.filter(function(c){
      if(state.activeCategory !== "All" && (c.category || "Uncategorized") !== state.activeCategory) return false;
      if(!q) return true;
      var hay = (fullName(c) + " " + (c.company||"") + " " + (c.email||"")).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if(state.sort === "name"){
      list.sort(function(a,b){ return fullName(a).localeCompare(fullName(b)); });
    } else {
      list.sort(function(a,b){
        var da = daysSince(a.lastContacted); var db_ = daysSince(b.lastContacted);
        if(da === null) return 1;
        if(db_ === null) return -1;
        return da - db_;
      });
    }
    return list;
  }

  // ---------- render: sidebar / category bar ----------
  function renderCategories(){
    var cats = orderedCategories(state.contacts);
    var total = state.contacts.length;

    function rowHtml(name, count, isBar){
      var active = state.activeCategory === name;
      var colors = name === "All" ? null : categoryColors(name);
      var dotStyle = colors ? ' style="background:' + colors[0] + '"' : "";
      if(isBar){
        return '<button class="cat-chip' + (active ? " active" : "") + '" data-cat="' + escapeHtml(name) + '">' +
          escapeHtml(name) + ' <span class="cat-chip-count">' + count + '</span></button>';
      }
      return '<li class="cat-item' + (active ? " active" : "") + '" data-cat="' + escapeHtml(name) + '">' +
        '<span class="cat-dot"' + dotStyle + '></span>' +
        '<span class="cat-label">' + escapeHtml(name) + '</span>' +
        '<span class="cat-count">' + count + '</span></li>';
    }

    var sideHtml = rowHtml("All", total, false);
    var barHtml = rowHtml("All", total, true);
    cats.forEach(function(name){
      var count = state.contacts.filter(function(c){ return (c.category || "Uncategorized") === name; }).length;
      sideHtml += rowHtml(name, count, false);
      barHtml += rowHtml(name, count, true);
    });

    els.catList.innerHTML = sideHtml;
    els.catBar.innerHTML = barHtml;

    els.categoryOptions.innerHTML = cats.map(function(c){ return '<option value="' + escapeHtml(c) + '">'; }).join("");
  }

  function bindCategoryClicks(){
    [els.catList, els.catBar].forEach(function(container){
      container.addEventListener("click", function(e){
        var el = e.target.closest("[data-cat]");
        if(!el) return;
        state.activeCategory = el.getAttribute("data-cat");
        renderAll();
      });
    });
  }

  // ---------- render: list ----------
  function renderList(){
    var list = filteredContacts();
    els.listTitle.textContent = state.activeCategory === "All" ? "All Contacts" : state.activeCategory;
    els.listCount.textContent = list.length + (list.length === 1 ? " person" : " people");

    if(list.length === 0){
      els.contactList.innerHTML =
        '<div class="empty-state">' +
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '<div class="empty-state-title">No one here yet</div>' +
        '<div class="empty-state-sub">' + (state.search ? "Nothing matches your search." : "Add a person to start tracking this relationship.") + '</div>' +
        '</div>';
      return;
    }

    els.contactList.innerHTML = list.map(function(c){
      var colors = categoryColors(c.category || "Uncategorized");
      var sel = c.id === state.selectedId ? " selected" : "";
      var stale = isStale(c);
      var sub = c.company || (c.category || "Uncategorized");
      return '<div class="contact-card' + sel + '" data-id="' + escapeHtml(c.id) + '">' +
        '<div class="avatar" style="background:' + colors[1] + '">' + escapeHtml(initials(c.firstName, c.lastName)) + '</div>' +
        '<div class="card-main">' +
          '<div class="card-top"><span class="card-name">' + escapeHtml(fullName(c)) + '</span>' + (stale ? '<span class="stale-dot" title="Overdue for a check-in"></span>' : '') + '</div>' +
          '<div class="card-sub">' + escapeHtml(sub) + '</div>' +
        '</div>' +
        '<div class="card-right"><div class="card-last tnum' + (stale ? " stale" : "") + '">' + relativeLabel(c.lastContacted) + '</div></div>' +
      '</div>';
    }).join("");
  }

  function bindListClicks(){
    els.contactList.addEventListener("click", function(e){
      var card = e.target.closest(".contact-card");
      if(!card) return;
      state.selectedId = card.getAttribute("data-id");
      state.editing = false;
      els.panes.className = "panes show-profile";
      renderAll();
    });
  }

  // ---------- render: profile ----------
  function selectedContact(){
    return state.contacts.find(function(c){ return c.id === state.selectedId; }) || null;
  }

  function renderProfile(){
    var c = selectedContact();
    if(!c){
      els.profileContent.innerHTML =
        '<div class="empty-state" style="padding-top:120px;">' +
        '<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
        '<div class="empty-state-title">Select someone</div>' +
        '<div class="empty-state-sub">Pick a person from the list to see their profile and notes.</div>' +
        '</div>';
      return;
    }

    var colors = categoryColors(c.category || "Uncategorized");
    var stale = isStale(c);
    var days = daysSince(c.lastContacted);

    if(state.editing){
      els.profileContent.innerHTML =
        '<div class="profile-inner">' +
          '<div class="section-head"><div class="section-title">Edit details</div></div>' +
          '<form id="editForm" class="edit-form">' +
            field("First name","firstName",c.firstName,"text",true) +
            field("Last name","lastName",c.lastName,"text",false) +
            field("Category","category",c.category,"text",false,'list="categoryOptions"') +
            fieldFull("Company","company",c.company) +
            field("Email","email",c.email,"email") +
            field("Phone","phone",c.phone,"tel") +
            field("Last spoke","lastContacted",c.lastContacted,"date") +
            '<div class="form-actions">' +
              '<button type="submit" class="btn btn-primary">Save changes</button>' +
              '<button type="button" class="btn" id="cancelEdit">Cancel</button>' +
            '</div>' +
          '</form>' +
        '</div>';
      bindEditForm(c);
      return;
    }

    els.profileContent.innerHTML =
      '<div class="profile-inner">' +
        '<div class="profile-header">' +
          '<div class="avatar-lg" style="background:' + colors[1] + '">' + escapeHtml(initials(c.firstName, c.lastName)) + '</div>' +
          '<div class="profile-heading">' +
            '<div class="profile-name">' + escapeHtml(fullName(c)) + '</div>' +
            '<div class="profile-meta-row">' +
              '<span class="chip" style="background:' + categorySoft(c.category) + ';color:' + colors[1] + '">' + escapeHtml(c.category || "Uncategorized") + '</span>' +
              (c.company ? '<span class="chip" style="background:var(--surface-2);color:var(--text-secondary)">' + escapeHtml(c.company) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="profile-actions">' +
            '<button class="btn btn-icon" id="editBtn" title="Edit details">' + pencilSvg() + '</button>' +
          '</div>' +
        '</div>' +

        (stale ? '<div class="stale-banner">' + warnSvg() + 'It’s been ' + days + ' days — might be time to reach out.</div>' : '') +

        '<div class="info-grid">' +
          infoField("Email", c.email ? ('<a href="mailto:' + escapeHtml(c.email) + '">' + escapeHtml(c.email) + '</a>') : null) +
          infoField("Phone", c.phone ? ('<a href="tel:' + escapeHtml(c.phone) + '">' + escapeHtml(c.phone) + '</a>') : null) +
          infoField("Last spoke", '<span class="tnum">' + formatDateLong(c.lastContacted) + '</span> <span class="info-value muted">(' + relativeLabel(c.lastContacted) + ')</span>', true) +
        '</div>' +

        '<div class="contacted-row">' +
          '<button class="btn btn-primary btn-sm" id="markTodayBtn">' + checkSvg() + 'Log a conversation today</button>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><div class="section-title">Notes</div><div class="save-hint" id="notesSaveHint"></div></div>' +
          '<textarea class="notes-box" id="notesBox" placeholder="What matters with this relationship — context, preferences, open threads…">' + escapeHtml(c.notes || "") + '</textarea>' +
        '</div>' +

        '<div class="delete-zone">' +
          '<button class="btn btn-ghost btn-danger btn-sm" id="deleteBtn">Remove person</button>' +
        '</div>' +
      '</div>';

    bindProfileActions(c);
  }

  function categorySoft(cat){
    var map = { "Manager":"var(--accent-soft)", "Client":"var(--sage-soft)", "Vendor":"var(--plum-soft)" };
    return map[cat] || "var(--surface-2)";
  }
  function field(label, name, value, type, required, extra){
    return '<div class="field"><label>' + label + '</label><input name="' + name + '" type="' + type + '" value="' + escapeHtml(value || "") + '"' + (required ? " required" : "") + (extra ? " " + extra : "") + '></div>';
  }
  function fieldFull(label, name, value){
    return '<div class="field full"><label>' + label + '</label><input name="' + name + '" type="text" value="' + escapeHtml(value || "") + '"></div>';
  }
  function infoField(label, valueHtml, full){
    return '<div class="info-field' + (full ? " span2" : "") + '"><div class="info-label">' + label + '</div><div class="info-value' + (valueHtml ? "" : " muted") + '">' + (valueHtml || "Not on file") + '</div></div>';
  }
  function pencilSvg(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>'; }
  function warnSvg(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto"><path d="M12 3l10 18H2L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="17" r="0.9" fill="currentColor"/></svg>'; }
  function checkSvg(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l5 5L20 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

  function bindProfileActions(c){
    var editBtn = document.getElementById("editBtn");
    if(editBtn) editBtn.addEventListener("click", function(){ state.editing = true; renderProfile(); });

    var markBtn = document.getElementById("markTodayBtn");
    if(markBtn) markBtn.addEventListener("click", function(){
      var iso = toISODate(new Date());
      updateContact(c.id, { lastContacted: iso }).then(function(){
        showToast("Logged today's conversation.");
      });
    });

    var notesBox = document.getElementById("notesBox");
    var hint = document.getElementById("notesSaveHint");
    if(notesBox){
      var t = null;
      notesBox.addEventListener("input", function(){
        hint.textContent = "Saving…";
        hint.className = "save-hint";
        clearTimeout(t);
        t = setTimeout(function(){
          updateContact(c.id, { notes: notesBox.value }).then(function(){
            hint.textContent = "Saved";
            hint.className = "save-hint saved";
          });
        }, 650);
      });
    }

    var deleteBtn = document.getElementById("deleteBtn");
    if(deleteBtn) deleteBtn.addEventListener("click", function(){
      if(deleteBtn.getAttribute("data-confirm") !== "1"){
        deleteBtn.setAttribute("data-confirm", "1");
        deleteBtn.textContent = "Click again to confirm";
        setTimeout(function(){
          if(deleteBtn) { deleteBtn.setAttribute("data-confirm", "0"); deleteBtn.textContent = "Remove person"; }
        }, 3000);
        return;
      }
      deleteContact(c.id).then(function(){
        state.selectedId = null;
        els.panes.className = "panes show-list";
        showToast("Removed " + fullName(c) + ".");
        renderAll();
      });
    });
  }

  function bindEditForm(c){
    var form = document.getElementById("editForm");
    var cancel = document.getElementById("cancelEdit");
    cancel.addEventListener("click", function(){ state.editing = false; renderProfile(); });
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var fd = new FormData(form);
      var data = {
        firstName: (fd.get("firstName")||"").trim(),
        lastName: (fd.get("lastName")||"").trim(),
        category: (fd.get("category")||"").trim() || "Uncategorized",
        company: (fd.get("company")||"").trim(),
        email: (fd.get("email")||"").trim(),
        phone: (fd.get("phone")||"").trim(),
        lastContacted: fd.get("lastContacted") || c.lastContacted || ""
      };
      updateContact(c.id, data).then(function(){
        state.editing = false;
        showToast("Saved.");
      });
    });
  }

  // ---------- add modal ----------
  function openAddModal(){
    els.addForm.reset();
    var dateInput = els.addForm.querySelector('[name="lastContacted"]');
    dateInput.value = toISODate(new Date());
    var catInput = els.addForm.querySelector('[name="category"]');
    if(state.activeCategory !== "All") catInput.value = state.activeCategory;
    els.addOverlay.classList.add("open");
    setTimeout(function(){ els.addForm.querySelector('[name="firstName"]').focus(); }, 30);
  }
  function closeAddModal(){ els.addOverlay.classList.remove("open"); }

  els.addBtn.addEventListener("click", openAddModal);
  els.cancelAdd.addEventListener("click", closeAddModal);
  els.addOverlay.addEventListener("click", function(e){ if(e.target === els.addOverlay) closeAddModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeAddModal(); });

  els.addForm.addEventListener("submit", function(e){
    e.preventDefault();
    var fd = new FormData(els.addForm);
    var data = {
      firstName: (fd.get("firstName")||"").trim(),
      lastName: (fd.get("lastName")||"").trim(),
      category: (fd.get("category")||"").trim() || "Uncategorized",
      company: (fd.get("company")||"").trim(),
      email: (fd.get("email")||"").trim(),
      phone: (fd.get("phone")||"").trim(),
      lastContacted: fd.get("lastContacted") || "",
      notes: ""
    };
    if(!data.firstName) return;
    addContact(data).then(function(id){
      closeAddModal();
      state.selectedId = id;
      state.activeCategory = "All";
      els.panes.className = "panes show-profile";
      showToast("Added " + (data.firstName + " " + data.lastName).trim() + ".");
      renderAll();
    });
  });

  // ---------- search / sort ----------
  els.searchInput.addEventListener("input", function(){
    state.search = els.searchInput.value;
    renderList();
  });
  els.sortSeg.addEventListener("click", function(e){
    var btn = e.target.closest("[data-sort]");
    if(!btn) return;
    state.sort = btn.getAttribute("data-sort");
    Array.prototype.forEach.call(els.sortSeg.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b === btn);
    });
    renderList();
  });
  els.backBtn.addEventListener("click", function(){
    els.panes.className = "panes show-list";
  });

  // ---------- main render ----------
  function renderAll(){
    renderCategories();
    renderList();
    renderProfile();
  }

  bindCategoryClicks();
  bindListClicks();

  store.subscribe(function(contacts){
    state.contacts = contacts;
    if(state.selectedId && !contacts.some(function(c){ return c.id === state.selectedId; })){
      state.selectedId = null;
    }
    renderAll();
  });

  initStore();
})();
</script>
